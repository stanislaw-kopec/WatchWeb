spring.application.name=app

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/watchweb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.security.jwt.secret=${JWT_SECRET:watchweb-development-secret-key-change-me-please-1234567890}
app.security.jwt.access-token-ttl-minutes=15
app.security.refresh-token-ttl-days=7

app.storage.local.base-path=${LOCAL_STORAGE_BASE_PATH:./storage}
app.storage.local.max-file-size=5MB

server.port=8080
